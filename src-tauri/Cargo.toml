[package]
name = "serena-desktop"
version = "0.1.0"
description = "A lightweight desktop supervisor for Serena MCP Server"
authors = ["lifei6671"]
edition = "2024"

[lib]
name = "serena_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
rmcp = { version = "3.2.0", features = ["client", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml_ng = "0.10.0"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tempfile = "3.23.0"
tokio = { version = "1.53.1", features = ["process", "io-util", "net", "sync", "time"] }
tokio-util = "0.7.19"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading"] }
