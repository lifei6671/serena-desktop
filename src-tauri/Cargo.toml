[package]
name = "serena-desktop"
version = "0.3.0"
description = "A lightweight desktop supervisor for Serena MCP Server"
authors = ["lifei6671"]
edition = "2024"

[lib]
name = "serena_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
if-addrs = "0.15.0"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
rmcp = { version = "3.2.0", features = ["client", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "transport-child-process", "which-command"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.11.0"
getrandom = "0.4.3"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
url = "2.5.8"
tower = { version = "0.5.3", features = ["util"] }
flate2 = "1.1.10"
tar = "0.4"
serde_yaml_ng = "0.10.0"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tempfile = "3.23.0"
tokio = { version = "1.53.1", features = ["process", "io-util", "net", "sync", "time", "fs"] }
tokio-util = "0.7.19"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = "0.61.3"
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_System_SystemServices", "Win32_Security"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }
