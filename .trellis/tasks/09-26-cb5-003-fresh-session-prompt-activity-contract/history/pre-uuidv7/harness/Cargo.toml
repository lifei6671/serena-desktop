[package]
name = "cb5-003-session-probe"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
agent-client-protocol = { version = "=2.2.0", default-features = false }
async-trait = "0.1"
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "process", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
